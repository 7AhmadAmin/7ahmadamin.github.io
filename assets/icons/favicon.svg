<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Ahmad Amin favicon</title>
  <desc id="desc">Minimal SVG tab icon for Muhammad Ahmad Amin using a stylized MA monogram with a warm editorial background and coral accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9D7BE"/>
      <stop offset="100%" stop-color="#D9C1A0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1A1612" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="107.5" fill="none" stroke="#C8B08D" stroke-width="1.5"/>

  <!-- stylized MA / A monogram -->
  <g filter="url(#shadow)">
    <path d="M160 366 L222 152" fill="none" stroke="#17130F" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M350 366 L288 152" fill="none" stroke="#E87761" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M193 289 H318" fill="none" stroke="#17130F" stroke-width="24" stroke-linecap="round"/>
    <!-- inner mark to hint the M -->
    <path d="M222 152 L256 230 L289 152" fill="none" stroke="#1E3557" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- editorial accent -->
  <circle cx="372" cy="368" r="16" fill="#E87761"/>
  <path d="M112 412 C157 430, 216 440, 256 440 C306 440, 354 431, 399 412" fill="none" stroke="#B49873" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
</svg>
